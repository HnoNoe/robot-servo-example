name: build-firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make
      - name: Build firmware
        run: make
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: servo-firmware
          path: |
            build/servo_fw.bin
            build/servo_fw.hex
          retention-days: 14
